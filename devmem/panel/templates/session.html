{% extends 'base.html' %}{% block body %}<h1>Session {{session_id}}</h1><canvas id="timeline"></canvas><script>const e={{events|tojson}};new Chart(document.querySelector('#timeline'),{type:'line',data:{labels:e.map(x=>x.ts),datasets:[{label:'tokens',data:e.map(x=>x.input_tokens+x.output_tokens+x.cache_read_tokens)}]}})</script><table>{% for x in events %}<tr><td>{{x.ts}}</td><td>{{x.input_tokens}}</td><td>{{x.output_tokens}}</td><td>{{x.cache_read_tokens}}</td></tr>{% endfor %}</table>{% endblock %}
