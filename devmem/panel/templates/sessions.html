{% extends 'base.html' %}{% block body %}<h1>Sessions</h1><table><tr><th>Agent</th><th>Project</th><th>Model</th><th>Start/end</th><th>Turns</th><th>Input/output/cache</th></tr>{% for x in rows %}<tr><td>{{x.agent}}</td><td>{{x.project}}</td><td>{{x.model}}</td><td><a href="/sessions/{{x.session_id}}">{{x.start}} → {{x.end}}</a></td><td>{{x.turns}}</td><td>{{x.input}} / {{x.output}} / {{x.cache}}</td></tr>{% endfor %}</table>{% endblock %}
